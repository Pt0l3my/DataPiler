# DataPiler.exe, built from launcher-src/ (settled S4; build plan P10), placed in one zip of the whole app: the
# tagged source as `git archive` makes it, with the built exe and the toolchain's notices in it (settled S24). The
# draft release carries the zip, its sha256 and the notices on their own too (DP9); the exe's sha256 is in this
# workflow's log, so the owner downloads one file. Publishing the release stays the owner's act. It starts in either of two ways:
# a version tag the owner pushes, or the owner's "Run workflow" button on GitHub's Actions page (settled S4's note),
# which reads the version from datapiler/__init__.py and makes the draft for tag v<version>; GitHub creates that tag
# when the owner publishes the draft.
# Every action is pinned by its commit; the tag it was read from is in the comment beside it.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  # Publishing a draft that Run workflow made creates its tag, and that tag's push starts this workflow again. A
  # release published for the tag already holds everything, so the run stops here instead of failing later.
  gate:
    name: Stop if the tag's release is already published
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=true
          if [ "$GITHUB_EVENT_NAME" = "push" ] && gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "the release for $GITHUB_REF_NAME is already published: nothing to do"
            go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  build:
    name: Build DataPiler.exe on Windows with MSYS2's MinGW-w64
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils
      - name: The tag names datapiler/__init__.py's VERSION
        run: |
          version=$(tr -d '\r' < datapiler/__init__.py | sed -n 's/^VERSION = "\([0-9][0-9.]*\)"$/\1/p')
          if [ -z "$version" ]; then echo "::error::no VERSION line read from datapiler/__init__.py"; exit 1; fi
          echo "VERSION $version, event $GITHUB_EVENT_NAME, ref $GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then test "v$version" = "$GITHUB_REF_NAME"; fi
      - name: Build as BUILD.md says
        run: |
          mkdir -p build
          cp launcher-src/launcher.cpp launcher-src/app.rc launcher-src/app.manifest build/
          cd build
          windres app.rc -O coff -o app.res
          g++ -std=c++17 -O2 -municode -mwindows -static -s -Wl,--no-insert-timestamp launcher.cpp app.res -o DataPiler.exe -lshell32 -lole32
          g++ --version | head -n 1
          ld --version | head -n 1
          pacman -Q mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils
          sha256sum DataPiler.exe | tee DataPiler.exe.sha256
      # The exe is linked -static: parts of the mingw-w64 runtime (its CRT, and winpthreads with MSYS2's posix-thread
      # GCC) are inside it, and their licences ask that their notices go with a binary (NOTICE, section 4).
      - name: The toolchain's notices, which go with the exe
        run: |
          lic=/mingw64/share/licenses
          ls "$lic"
          out=build/THIRD-PARTY-NOTICES.txt
          printf '%s\n\n' "DataPiler.exe is linked statically with MSYS2's MinGW-w64 toolchain. These are the notices of the runtime parts inside it, copied from the toolchain that built it (NOTICE, section 4)." > "$out"
          found=""
          for dir in "$lic"/*crt* "$lic"/*winpthread* "$lic"/gcc-libs; do
            [ -d "$dir" ] || continue
            d=$(basename "$dir")
            found="$found $d"
            for f in "$dir"/*; do
              [ -f "$f" ] || continue
              printf '==== %s/%s ====\n\n' "$d" "$(basename "$f")" >> "$out"
              tr -d '\r' < "$f" >> "$out"
              printf '\n\n' >> "$out"
            done
          done
          echo "notices from:$found"
          case "$found" in *crt*) ;; *) echo "::error::the mingw-w64 CRT's licence was not found in $lic"; exit 1;; esac
          case "$found" in *winpthread*) ;; *) echo "::error::winpthreads' licence was not found in $lic"; exit 1;; esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: launcher
          path: |
            build/DataPiler.exe
            build/DataPiler.exe.sha256
            build/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

  release:
    name: Attach it to a draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: src
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: launcher
      - name: The release's tag, from the pushed tag or, for Run workflow, from VERSION
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(tr -d '\r' < src/datapiler/__init__.py | sed -n 's/^VERSION = "\([0-9][0-9.]*\)"$/\1/p')
            if [ -z "$version" ]; then echo "::error::no VERSION line read from datapiler/__init__.py"; exit 1; fi
            tag="v$version"
            if git -C src ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$tag" > /dev/null; then
              echo "::error::tag $tag already exists: raise VERSION, or push the tag to release it"; exit 1
            fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "release tag $tag"
      - name: Check the exe
        run: |
          sha256sum -c DataPiler.exe.sha256
          file -b DataPiler.exe | grep -Eq '^PE32\+ executable .*\(GUI\).*x86-64'
          strings -a -el DataPiler.exe | grep -qx "${TAG#v}.0"
          grep -q "==== crt/" THIRD-PARTY-NOTICES.txt
      - name: One zip of the whole app, the tagged source with the exe placed in it
        run: |
          app="DataPiler-${TAG#v}"
          test "$(git -C src rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$(git -C src rev-parse HEAD)" = "$(git -C src rev-parse "$TAG^{commit}")"
          fi
          git -C src archive --format=zip --prefix="DataPiler/" -o "../$app.zip" HEAD
          mkdir -p "stage/DataPiler"
          cp DataPiler.exe THIRD-PARTY-NOTICES.txt "stage/DataPiler/"
          (cd stage && zip -X -q "../$app.zip" "DataPiler/DataPiler.exe" "DataPiler/THIRD-PARTY-NOTICES.txt")
          unzip -l "$app.zip" | grep -q " DataPiler/DataPiler.exe$"
          unzip -l "$app.zip" | grep -q " DataPiler/datapiler.py$"
          # one folder, named without the version (DP10)
          test "$(unzip -Z1 "$app.zip" | cut -d / -f 1 | sort -u)" = "DataPiler"
          unzip -p "$app.zip" "DataPiler/DataPiler.exe" | sha256sum | cut -d " " -f 1 | grep -qx "$(cut -d " " -f 1 DataPiler.exe.sha256)"
          sha256sum "$app.zip" | tee "$app.zip.sha256"
      - name: A draft release for the tag, with the exe, its sha256, the toolchain's notices and the app's zip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          app="DataPiler-${TAG#v}"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then where="--verify-tag"; else where="--target=$GITHUB_SHA"; fi
          notes="src/docs/release-notes/${TAG#v}.md"
          if [ ! -s "$notes" ]; then echo "::error::no release notes at docs/release-notes/${TAG#v}.md"; exit 1; fi
          { tr -d '\r' < "$notes"; printf '\n**Files**\n- `%s.zip`: the whole app, the source at this commit with `DataPiler.exe` and `THIRD-PARTY-NOTICES.txt` placed in it; `%s.zip.sha256` holds its sha256.\n- `THIRD-PARTY-NOTICES.txt`: the notices of the MinGW-w64 runtime parts linked into the exe, also inside the zip.\n- The exe was built by this workflow from `launcher-src/` at this commit; its sha256 is in the run'"'"'s log (%s/%s/actions/runs/%s), and BUILD.md says how to compare it with your own build.\n' "$app" "$app" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"; } > notes.md
          gh release create "$TAG" THIRD-PARTY-NOTICES.txt "$app.zip" "$app.zip.sha256" --draft "$where" --title "DataPiler ${TAG#v}" --notes-file notes.md
